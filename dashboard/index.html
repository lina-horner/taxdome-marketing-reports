<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaxDome Marketing — Weekly Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
  :root {
    --primary: #4C6EF5;
    --success: #2F9E44;
    --warning: #E8590C;
    --danger:  #E03131;
    --bg:      #F8F9FA;
    --card:    #FFFFFF;
    --text:    #212529;
    --muted:   #6C757D;
    --border:  #E9ECEF;
    --shadow:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-hover: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.06);
  }
  [data-theme="dark"] {
    --bg:     #1A1A2E;
    --card:   #16213E;
    --text:   #E0E0E0;
    --muted:  #9AA0B4;
    --border: #2A3358;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.25);
    --shadow-hover: 0 4px 14px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.35);
  }
  [data-theme="dark"] header h1,
  [data-theme="dark"] .kpi-value,
  [data-theme="dark"] .card h2 { color: #FFFFFF; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1600px; margin: 0 auto; padding: 28px 32px 60px; }

  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 24px; margin-bottom: 28px; flex-wrap: wrap;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
  }
  header .subtitle { color: var(--muted); font-size: 14px; font-weight: 500; }

  .theme-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px; border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; box-shadow: var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .theme-btn:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }

  /* Tab navigation */
  .tab-bar {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .tab-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    padding: 12px 18px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Q2 targets table */
  .q2-targets-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 6px;
  }
  .q2-targets-table th,
  .q2-targets-table td {
    text-align: right;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .q2-targets-table th:first-child,
  .q2-targets-table td:first-child {
    text-align: left;
    font-weight: 600;
  }
  .q2-targets-table thead th {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 2px solid var(--border);
  }
  .q2-targets-table tbody tr:hover { background: rgba(76,110,245,0.04); }
  .q2-targets-table tfoot td {
    font-weight: 700;
    border-top: 2px solid var(--border);
    border-bottom: none;
    background: rgba(76,110,245,0.05);
  }

  /* KPI Cards */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .kpi-card {
    position: relative;
    background: var(--card);
    border-radius: 12px;
    padding: 18px 18px 14px 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid var(--border);
    transition: box-shadow 0.2s, transform 0.2s;
    display: flex;
    flex-direction: column;
    min-height: 220px;
  }
  .kpi-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .kpi-card::before {
    content: '';
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 5px;
  }
  .kpi-card.green::before  { background: var(--success); }
  .kpi-card.orange::before { background: var(--warning); }
  .kpi-card.red::before    { background: var(--danger); }
  .kpi-card.gray::before   { background: var(--muted); }
  .kpi-card.info::before   { background: var(--primary); }
  .kpi-card .kpi-spark { margin-top: auto; }

  /* Status badges */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 8px;
    line-height: 1.4;
    border: 1px solid transparent;
  }
  .badge.review  { background: rgba(232,89,12,0.12); color: var(--warning); border-color: rgba(232,89,12,0.35); }
  .badge.pending { background: rgba(108,117,125,0.14); color: var(--muted); border-color: rgba(108,117,125,0.35); }
  .badge.live    { background: rgba(47,158,68,0.12); color: var(--success); border-color: rgba(47,158,68,0.35); }

  .kpi-name {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px;
  }
  .kpi-value {
    font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
    margin-bottom: 4px;
  }
  .kpi-compare {
    font-size: 12px; font-weight: 500; color: var(--muted);
    margin-bottom: 8px;
  }
  .kpi-compare .pct { font-weight: 700; }
  .kpi-compare.green  .pct { color: var(--success); }
  .kpi-compare.orange .pct { color: var(--warning); }
  .kpi-compare.red    .pct { color: var(--danger); }
  .kpi-spark { width: 100%; height: 44px; }

  /* Charts row */
  .charts-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .charts-grid-full {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
  }
  .card .chart-sub {
    font-size: 12px; color: var(--muted); margin-bottom: 10px;
  }
  .chart-summary {
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    margin-bottom: 14px;
    background: rgba(76,110,245,0.06);
    border-left: 3px solid var(--primary);
    border-radius: 4px;
    line-height: 1.5;
  }
  .chart-summary .sep { color: var(--muted); font-weight: 400; margin: 0 10px; }
  .chart-summary .delta { font-size: 12px; font-weight: 600; margin-left: 4px; }
  .chart-summary .delta.up   { color: var(--success); }
  .chart-summary .delta.down { color: var(--danger); }
  .plot { width: 100%; }

  /* Chart alignment overlay — used when a chart's data is under review */
  .chart-overlay-wrap { position: relative; }
  .chart-alignment-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(248, 249, 250, 0.68);
    border-radius: 8px;
    pointer-events: none;
  }
  [data-theme="dark"] .chart-alignment-overlay {
    background: rgba(18, 22, 29, 0.72);
  }
  .chart-alignment-overlay-inner {
    background: var(--card);
    border: 2px solid var(--warning);
    border-radius: 10px;
    padding: 18px 28px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    max-width: 80%;
  }

  /* OKR chart legend */
  .okr-legend {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .okr-legend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 10px;
  }
  .okr-dot {
    display: inline-block;
    width: 11px; height: 11px;
    border-radius: 3px;
    margin-right: 7px;
    vertical-align: -1px;
  }
  .okr-dot.green  { background: var(--success); }
  .okr-dot.orange { background: var(--warning); }
  .okr-dot.red    { background: var(--danger); }
  .okr-dot.gray   { background: rgba(108,117,125,0.45); }
  .okr-legend-note {
    font-size: 11.5px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.5;
    max-width: 900px;
  }
  .okr-transition-note {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 11.5px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.5;
    max-width: 900px;
  }

  /* Attention section */
  .attention-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
  }
  .attn-card {
    border-radius: 12px;
    padding: 18px 20px;
    display: flex; gap: 14px; align-items: flex-start;
    border-left: 4px solid;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .attn-card.green  { border-left: 4px solid var(--success); background: linear-gradient(90deg, rgba(47,158,68,0.08), transparent 60%), var(--card); }
  .attn-card.orange { border-left: 4px solid var(--warning); background: linear-gradient(90deg, rgba(232,89,12,0.08), transparent 60%), var(--card); }
  .attn-card.red    { border-left: 4px solid var(--danger);  background: linear-gradient(90deg, rgba(224,49,49,0.08), transparent 60%), var(--card); }
  .attn-card.gray   { border-left: 4px solid var(--muted);   background: linear-gradient(90deg, rgba(108,117,125,0.08), transparent 60%), var(--card); }
  .attn-card.info   { border-left: 4px solid var(--primary); background: linear-gradient(90deg, rgba(76,110,245,0.08), transparent 60%), var(--card); }
  .attn-icon {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 14px;
  }
  .attn-icon.green  { background: var(--success); }
  .attn-icon.orange { background: var(--warning); }
  .attn-icon.red    { background: var(--danger); }
  .attn-icon.gray   { background: var(--muted); }
  .attn-icon.info   { background: var(--primary); }
  .attn-title {
    font-weight: 600; font-size: 13px; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .attn-title.green  { color: var(--success); }
  .attn-title.orange { color: var(--warning); }
  .attn-title.red    { color: var(--danger); }
  .attn-title.gray   { color: var(--muted); }
  .attn-title.info   { color: var(--primary); }
  .attn-body { font-size: 13.5px; line-height: 1.45; color: var(--text); }

  .section-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin: 8px 0 14px;
  }

  @media (max-width: 1400px) {
    .attention-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 1100px) {
    .charts-grid { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 18px; }
    .kpi-row { grid-template-columns: 1fr; }
    .attention-grid { grid-template-columns: 1fr; }
    .kpi-card { min-height: 0; }
    header h1 { font-size: 22px; }
  }

  @media print {
    body { background: #fff; }
    .theme-btn { display: none; }
    .kpi-card, .card, .attn-card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
    .charts-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>TaxDome Marketing — Weekly Overview</h1>
    <div class="subtitle">Last updated: Jul 14, 2026 &nbsp;|&nbsp; Week of Jul 7 – Jul 13 &nbsp;|&nbsp; All-market marketing leads (list 6894 · createdate)</div>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">Toggle light mode</button>
</header>

<nav class="tab-bar" role="tablist">
  <button class="tab-btn active" data-tab="overview" role="tab" aria-selected="true">Overview</button>
  <button class="tab-btn" data-tab="leads" role="tab" aria-selected="false">Leads</button>
  <button class="tab-btn" data-tab="mqls" role="tab" aria-selected="false">MQLs</button>
  <button class="tab-btn" data-tab="sqls" role="tab" aria-selected="false">SQLs</button>
  <button class="tab-btn" data-tab="funnel" role="tab" aria-selected="false">Funnel</button>
</nav>
