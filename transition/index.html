const buf=Uint8Array.from(atob(B),c=>c.charCodeAt(0));
const salt=buf.slice(0,16),iv=buf.slice(16,28),data=buf.slice(28);
async function unlock(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data);
 const ds=new DecompressionStream("gzip");
 const html=await new Response(new Response(plain).body.pipeThrough(ds)).text();
 document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();
 const b=e.target.querySelector("button");b.textContent="Unlocking\u2026";
 try{await unlock(document.getElementById("pw").value);}catch(_){b.textContent="Unlock";document.getElementById("err").textContent="Incorrect password";}});
</script></body></html>
